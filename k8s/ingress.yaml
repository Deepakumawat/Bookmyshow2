apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookmyshow-ingress
  namespace: bookmyshow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: bookmyshow.yourdomain.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bookmyshow-service
                port:
                  number: 80
