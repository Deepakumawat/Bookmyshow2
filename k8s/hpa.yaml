apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bookmyshow-hpa
  namespace: bookmyshow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookmyshow-app
  minReplicas: 2    # always keep 2 running
  maxReplicas: 10   # scale up to 10 during traffic spike
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70    # scale up when CPU > 70%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80    # scale up when memory > 80%
