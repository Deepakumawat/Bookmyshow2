# Server Configuration
server.port=${PORT:8080}

# Database Configuration
# Using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:bookmyshow;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Logging Configuration
spring.jpa.open-in-view=false
logging.level.org.springframework.web=INFO
logging.level.Bookmyshow2=DEBUG

# CORS Configuration
server.servlet.allow-cross-origin-requests=true

# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=bookmyshow
spring.data.mongodb.auto-index-creation=true

# OpenAI & TMDB — loaded from .env via spring-dotenv
openai.api.key=${OPENAI_API_KEY:}
tmdb.api.key=${TMDB_API_KEY:}

# AI response cache TTL in seconds (1 hour)
ai.cache.ttl=3600

# Resend email API — set RESEND_API_KEY in Render env vars (free at resend.com)
resend.api.key=${RESEND_API_KEY:}
