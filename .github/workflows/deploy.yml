name: BookMyShow CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bookmyshow
  DOCKER_TAG: ${{ github.sha }}

jobs:

  # ── Job 1: Build & Test ─────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ── Job 2: Build & Push Docker Image ───────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_GOOGLE_CLIENT_ID=562767659756-luirrkk2vf1ld6jt7j6n7ujunu3c4kdb.apps.googleusercontent.com
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

      - name: Image pushed successfully
        run: echo "Docker image pushed → ${{ env.DOCKER_IMAGE }}:latest"

  # ── Job 3: Deploy to Render ─────────────────────────────────────────────
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"
        continue-on-error: true

      - name: Deploy triggered
        run: echo "Render deployment triggered!"

  # ── Job 4: Deploy to Kubernetes (optional) ─────────────────────────────
  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && secrets.KUBECONFIG != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update image in deployment
        run: |
          kubectl set image deployment/bookmyshow-app \
            bookmyshow=${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} \
            -n bookmyshow

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/bookmyshow-app \
            -n bookmyshow \
            --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n bookmyshow
          echo "Deployment successful!"

  # ── Job 5: Health Check ─────────────────────────────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy-render
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Wait for Render to start
        run: sleep 30

      - name: Check site is live
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bookmyshow2-ibql.onrender.com/)
          echo "Site status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: Site returned $STATUS"
          else
            echo "Site is healthy!"
          fi
        continue-on-error: true
